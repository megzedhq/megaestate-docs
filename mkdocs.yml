site_name: MegaEstate Documentation
site_url: https://megzedhq.github.io/megaestate-docs/
site_description: Step-by-step guides for MegaEstate Admin Panel and Mobile App
site_author: Megzed
edit_uri: ""

nav:
  - 👋 Introduction: index.md

  - 📘 Complete DOCX Guide: complete-installation-guide.md

  - 🛠️ Setup Admin Panel:
      - ✅ Prerequisite: admin-panel/prerequisite.md
      - ⚙️ Installation Steps: admin-panel/installation.md
      - 🔧 Post-Install Settings: admin-panel/post-install-settings.md
      - 🧩 Configuration: admin-panel/configuration.md

  - 📱 Setup Mobile Application:
      - ✅ Prerequisite: mobile/prerequisite.md
      - 🧱 Setup & Build: mobile/setup.md

  - ✨ Product Features: features.md
  - 🧾 Release Notes: changelog.md
  - ❓ FAQs: faq.md
  - 🧑‍💻 Support: support.md


theme:
  name: material
  language: en
  logo: assets/applogo/android-chrome-512x512.png
  favicon: assets/favicon/favicon.ico
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    # Light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright © Megzed. All rights reserved.
